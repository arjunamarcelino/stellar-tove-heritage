name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  workspace:
    name: JS workspace (web + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - name: Secret gate — fail on a committed Stellar secret key (S + 55 base32)
        run: |
          if git grep -nE 'S[A-Z2-7]{55}' -- . ':!*.md'; then
            echo "::error::Possible Stellar secret key committed"
            exit 1
          fi

  # NOTE: the Soroban contract pipeline moved to contracts-ci.yml — a dedicated
  # 4-job workflow (unit+integration, wasm build, canonical-wasm determinism,
  # testnet e2e) pinned to the 1.95.0 toolchain that apps/contracts/rust-toolchain.toml
  # requires for byte-reproducible canonical hashes. A single `toolchain: stable`
  # build here would fight that pin, so this job was removed to avoid duplicate
  # (and conflicting) contract CI.
