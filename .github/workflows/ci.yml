name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  workspace:
    name: JS workspace (web + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build
      - name: Secret gate — fail on a committed Stellar secret key (S + 55 base32)
        run: |
          if git grep -nE 'S[A-Z2-7]{55}' -- . ':!*.md'; then
            echo "::error::Possible Stellar secret key committed"
            exit 1
          fi

  contracts:
    name: Soroban contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          target: wasm32v1-none
      - name: Install Stellar CLI (prebuilt binary)
        run: |
          curl -sSfL \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/stellar.tar.gz
          mkdir -p /tmp/stellar-cli
          tar -xzf /tmp/stellar.tar.gz -C /tmp/stellar-cli
          sudo cp "$(find /tmp/stellar-cli -type f -name stellar | head -1)" /usr/local/bin/stellar
          sudo chmod +x /usr/local/bin/stellar
          stellar --version
      - name: Build contract
        working-directory: apps/contracts
        run: stellar contract build
      - name: Pin ed25519-dalek to 2.x (env-host testutils incompatible with 3.0)
        working-directory: apps/contracts
        run: cargo update -p ed25519-dalek --precise 2.1.1
      - name: Test contract
        working-directory: apps/contracts
        run: cargo test
