[package]
name = "tove-webauthn-verifier"
description = "WebAuthn (secp256r1 passkey) signature verifier for Tove smart accounts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Match the dev-deps OpenZeppelin stellar-accounts uses for its own webauthn tests.
p256 = { version = "0.13.2", features = ["ecdsa"] }
hex-literal = "1.0.0"
