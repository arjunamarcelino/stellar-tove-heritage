# Pinned so the canonical WASM build is byte-reproducible across machines
# and CI (TOV-146). The committed wasm-manifest.txt hashes are produced with
# exactly this toolchain; bumping the channel requires regenerating the
# manifest via `scripts/build-canonical.sh`.
[toolchain]
channel = "1.95.0"
targets = ["wasm32v1-none"]
profile = "minimal"
