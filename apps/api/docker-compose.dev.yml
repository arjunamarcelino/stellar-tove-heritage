# Use: docker compose -f docker-compose.dev.yml up -d
# Then: yarn start:dev (natively, no Docker volume overhead)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-tove}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tove_secret}
      POSTGRES_DB: ${DB_DATABASE:-tove_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
